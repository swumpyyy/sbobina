[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sbobina"
version = "1.4.0"
description = "Trasforma le registrazioni delle lezioni universitarie in appunti e schemi accurati."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "httpx2>=2.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf[image]>=5.0",  # [image]: le pagine scansionate passano all'OCR
]

[project.optional-dependencies]
# Trascrizione locale (gratuita, offline) con Whisper large-v3.
locale = ["faster-whisper>=1.1", "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx-lm>=0.28; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# App nativa per macOS (finestra propria invece del browser).
app = ["pywebview>=6", "pyobjc-framework-UserNotifications>=11; sys_platform == 'darwin'", "pyobjc-framework-Vision>=11; sys_platform == 'darwin'"]
# Windows: Whisper su GPU NVIDIA (DLL CUDA via pip), OCR di Windows, ffmpeg via pip. L'AI degli appunti è llama.cpp,
# scaricato da Sbobina al primo avvio.
windows = [
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
    "static-ffmpeg>=2.5; sys_platform == 'win32'",
    "winrt-runtime>=3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3; sys_platform == 'win32'",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sbobina = "sbobina.cli:main"

[tool.setuptools.packages.find]
include = ["sbobina*"]

[tool.setuptools.package-data]
sbobina = ["static/*", "static/fonts/*", "static/vendor/*", "static/vendor/katex/*", "static/vendor/katex/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
