[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sbobina"
version = "0.1.0"
description = "Trasforma le registrazioni delle lezioni universitarie in appunti e schemi accurati."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "httpx2>=2.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# Trascrizione locale (gratuita, offline) con Whisper large-v3.
locale = ["faster-whisper>=1.1", "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# App nativa per macOS (finestra propria invece del browser).
app = ["pywebview>=6"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sbobina = "sbobina.cli:main"

[tool.setuptools.packages.find]
include = ["sbobina*"]

[tool.setuptools.package-data]
sbobina = ["static/*", "static/fonts/*", "static/vendor/*", "static/vendor/katex/*", "static/vendor/katex/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
