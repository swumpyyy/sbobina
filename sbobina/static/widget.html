<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Registratore</title>
<link rel="stylesheet" href="/static/app.css">
<style>
/* Il registratore piccolo: una finestra retro di Sbobina in miniatura (barra del titolo col tema,
   bordo 1 px, angoli vivi), senza la griglia del desktop. Si trascina dalla barra del titolo. */
html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; }
body::before, body::after { display: none; }
.mini {
  position: absolute; inset: 0 4px 4px 0; display: grid; grid-template-rows: 26px 1fr;
  background: var(--finestra); border: 1px solid var(--tema-linea); box-shadow: 4px 4px 0 var(--tema-linea);
}
.barra {
  display: flex; align-items: center; gap: 8px; padding: 0 4px 0 10px;
  background: var(--tema); color: var(--su-tema); font-size: 12px; font-weight: 600; cursor: grab;
}
.barra .spia { width: 8px; height: 8px; border-radius: 50% !important; background: currentColor; opacity: .45; flex: none; }
.rec .barra .spia { background: var(--guasto); opacity: 1; outline: 1.5px solid var(--su-tema); animation: batte 1.1s steps(2, jump-none) infinite; }
@keyframes batte { 50% { opacity: .25; } }
.barra .nome { flex: 1; }
.barra .stato { font-family: var(--font-mono); font-weight: 400; font-size: 11px; letter-spacing: .06em; }
.barra button {
  width: 20px; height: 20px; padding: 0; display: grid; place-items: center; border: 1px solid transparent;
  background: transparent; color: inherit; cursor: pointer;
}
.barra button:hover { border-color: currentColor; }
.corpo { display: flex; align-items: center; gap: 10px; padding: 0 10px; min-width: 0; }
.tempo-mini {
  font-family: var(--font-ui); font-weight: 900; font-size: 26px; letter-spacing: -0.05em; line-height: 1;
  font-variant-numeric: tabular-nums; color: var(--inchiostro); min-width: 3.4ch;
}
.pausa .tempo-mini { opacity: .45; }
/* misuratore a celle: ogni barra è una colonna di quadratini che si riempie dal basso */
.vu-mini { flex: 1; height: 30px; display: flex; align-items: flex-end; gap: 2px; min-width: 0; }
.vu-mini i {
  flex: 1; height: 100%; transform-origin: bottom; transform: scaleY(.1); transition: transform 110ms var(--uscita);
  background: repeating-linear-gradient(to top, var(--tema) 0 3px, transparent 3px 5px);
}
.pausa .vu-mini i { opacity: .3; }
.testo { flex: 1; font-family: var(--font-mono); font-size: 11.5px; color: var(--inchiostro-tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.corpo .tasto { min-height: 32px; padding: 0 10px; gap: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
.corpo .tasto.quadrato { width: 32px; padding: 0; justify-content: center; }
.tasto .icona { width: 16px; height: 16px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="mini" id="widget">
  <div class="barra pywebview-drag-region">
    <span class="spia" aria-hidden="true"></span>
    <span class="nome">Registratore 1.1</span>
    <span class="stato" id="stato-barra"></span>
    <button id="riduci" type="button" aria-label="Riduci nella barra dei menu" title="Riduci nella barra dei menu">
      <svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
    </button>
  </div>
  <div class="corpo">
    <span class="tempo-mini" id="tempo" role="timer" hidden>0:00</span>
    <div class="vu-mini" id="vu" aria-hidden="true" hidden></div>
    <span class="testo" id="testo" role="status">Pronto a registrare</span>
    <button class="tasto grande" id="registra" type="button" title="Inizia a registrare">
      <svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Registra
    </button>
    <button class="tasto quadrato" id="pausa" type="button" aria-label="Pausa" title="Pausa" hidden></button>
    <button class="tasto grande quadrato" id="ferma" type="button" aria-label="Ferma e salva" title="Ferma e salva" hidden>
      <svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" fill="currentColor"/></svg>
    </button>
  </div>
</div>
<script src="/static/inglese.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const BARRE = 22;
  const ICONA_PAUSA = '<svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg>';
  const ICONA_PLAY = '<svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
  for (let i = 0; i < BARRE; i++) $("vu").append(document.createElement("i"));
  const storico = [];
  let timer = null;
  let inPausa = false;
  let avviso = 0;  // fino a quando resta il messaggio dopo Ferma

  async function api(percorso, corpo) {
    const r = await fetch(percorso, corpo === undefined ? {} : {
      method: "POST", headers: { "Content-Type": "application/json", "X-Sbobina": "1" }, body: JSON.stringify(corpo),
    });
    const dati = r.status === 204 ? {} : await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(dati.detail || `Errore ${r.status}`);
    return dati;
  }

  const orologio = (s) => {
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
  };

  function messaggio(testo, secondi = 0) {
    $("testo").textContent = testo;
    avviso = secondi ? Date.now() + secondi * 1000 : 0;
  }

  function mostra(s) {
    const w = $("widget");
    w.classList.toggle("rec", s.attiva && !s.pausa);
    w.classList.toggle("pausa", s.attiva && s.pausa);
    $("stato-barra").textContent = !s.attiva ? "" : s.pausa ? "PAUSA" : "REC";
    $("tempo").hidden = $("pausa").hidden = $("ferma").hidden = !s.attiva;
    $("vu").hidden = !s.attiva || !!s.errore;
    $("registra").hidden = s.attiva;
    $("testo").hidden = s.attiva && !s.errore;
    if (s.errore) messaggio(s.errore);
    else if (!s.attiva && Date.now() > avviso) messaggio("Pronto a registrare");
    inPausa = s.pausa;
    if (!s.attiva) return;
    $("tempo").textContent = orologio(s.secondi);
    $("pausa").innerHTML = s.pausa ? ICONA_PLAY : ICONA_PAUSA;
    $("pausa").setAttribute("aria-label", s.pausa ? "Riprendi" : "Pausa");
    $("pausa").title = s.pausa ? "Riprendi" : "Pausa";
    storico.push(s.pausa ? 0 : Math.max(0, Math.min(1, (s.livello + 60) / 60)));
    while (storico.length > BARRE) storico.shift();
    $("vu").querySelectorAll("i").forEach((b, k) => {
      b.style.transform = `scaleY(${0.1 + (storico[k - (BARRE - storico.length)] || 0) * 0.9})`;
    });
  }

  // Sempre acceso: anche la barra dei menu può mettere in pausa o fermare, e qui si vede subito.
  async function aggiorna() {
    clearTimeout(timer);
    try { mostra(await api("/api/registrazione")); } catch (e) { /* server non ancora pronto */ }
    timer = setTimeout(aggiorna, 150);
  }

  async function azione(fn) {
    try { await fn(); } catch (e) { messaggio(e.message, 8); $("testo").hidden = false; }
    aggiorna();
  }

  $("registra").addEventListener("click", () => azione(() => api("/api/registrazione/avvia", {})));
  $("pausa").addEventListener("click", () => azione(() => api(`/api/registrazione/${inPausa ? "riprendi" : "pausa"}`, {})));
  $("ferma").addEventListener("click", () => azione(async () => {
    await api("/api/registrazione/ferma", { elabora: false });
    messaggio("Salvata tra le lezioni da elaborare", 6);
    if (window.pywebview && window.pywebview.api.lezione_salvata) window.pywebview.api.lezione_salvata();
  }));
  $("riduci").addEventListener("click", () => {
    if (window.pywebview && window.pywebview.api.riduci_widget) window.pywebview.api.riduci_widget();
  });

  // Stesso aspetto dell'app: tema chiaro/scuro, accento e colore personale dalle impostazioni.
  api("/api/stato").then((info) => {
    const i = info.impostazioni || {};
    const radice = document.documentElement;
    if (i.tema && i.tema !== "sistema") radice.dataset.tema = i.tema;
    if (i.accento && i.accento !== "rosa") radice.dataset.accento = i.accento;
    radice.style.setProperty("--colore-tuo", i.colore || "#d45bb6");
    if (window.SbobinaLingua) window.SbobinaLingua(i.lingua || "it");
  }).catch(() => {});
  aggiorna();
})();
</script>
</body>
</html>
