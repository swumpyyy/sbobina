<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf2fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060c19" media="(prefers-color-scheme: dark)">
<title>Sbobina</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236fa2ff'/%3E%3Cstop offset='1' stop-color='%230d4fd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cg stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M9 13v6M13 10v12M17 8v16M21 11v10M25 14v4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/SchibstedGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/appunti.css">
<link rel="stylesheet" href="/static/app.css">
<!-- LIBRERIE -->
<script src="/static/render.js"></script>
</head>
<body>
<header class="testata">
  <a class="marchio" href="/" id="marchio">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="logo-blu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fa2ff"/><stop offset="1" stop-color="#0d4fd6"/></linearGradient></defs>
      <rect width="32" height="32" rx="10" fill="url(#logo-blu)"/>
      <rect x=".5" y=".5" width="31" height="31" rx="9.5" fill="none" stroke="#fff" stroke-opacity=".35"/>
      <g stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M9 13v6M13 10v12M17 8v16M21 11v10M25 14v4"/></g>
    </svg>
    <span>Sbobina</span>
  </a>
  <span class="stato-ai" id="stato-ai" role="status"></span>
  <span class="spazio"></span>
  <button class="tasto trasparente" id="btn-registra" type="button" title="Registra una lezione dal microfono">
    <svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    <span class="etichetta-lunga">Registra</span>
  </button>
  <button class="tasto tondo trasparente" id="btn-impostazioni" type="button" aria-label="Impostazioni" title="Impostazioni">
    <svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
  </button>
  <button class="tasto grande" id="btn-nuova" type="button">
    <svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span>Nuova <span class="etichetta-lunga">lezione</span></span>
  </button>
</header>

<div class="apparecchio">
  <aside class="rastrelliera" aria-label="Le tue lezioni">
    <label class="cerca">
      <svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <span class="solo-lettori">Cerca tra le lezioni</span>
      <input type="search" id="cerca" placeholder="Cerca per titolo o corso" autocomplete="off">
    </label>
    <div class="moduli" id="elenco"></div>
  </aside>
  <main class="piastra" id="contenuto"></main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
